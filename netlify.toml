[build]
  publish = "."
  functions = "netlify/functions"

# Keeps the client's existing fetch('/api/track-create') etc. calls working
# unchanged - they just get routed to the Netlify Functions.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# The whole app is one index.html with no build step or content hashing, so
# a cached copy means employees keep running an old version of the app with
# no way to tell. Force a revalidation on every load: the browser still gets
# a fast 304 when nothing changed, but a deploy is picked up immediately
# instead of after a manual hard-refresh.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hourly sweep so shipment status keeps updating on its own until Delivered,
# with no one needing to click "Refresh" - runs for every in-transit
# shipment regardless of whether the optional Shippo webhook is set up.
# Trivial load for this shop's volume (well within Netlify's free function
# limits even at this frequency).
[functions."track-cron"]
  schedule = "0 * * * *"

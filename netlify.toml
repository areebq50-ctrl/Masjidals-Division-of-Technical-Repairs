[build]
  publish = "."
  functions = "netlify/functions"

# Keeps the client's existing fetch('/api/track-create') etc. calls working
# unchanged - they just get routed to the Netlify Functions.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Daily fallback sweep so shipment status keeps updating until Delivered even
# if the Shippo webhook is never configured or is missed.
[functions."track-cron"]
  schedule = "0 13 * * *"
